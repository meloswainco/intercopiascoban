<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>POS Sandbox - Simulador Interactivo Multiticket</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#203243",
                        "secondary-fixed-dim": "#c3c0ff",
                        "on-primary-fixed": "#001c37",
                        "secondary-fixed": "#e2dfff",
                        "surface": "#f7f9ff",
                        "surface-container-high": "#d8eaff",
                        "inverse-on-surface": "#e8f2ff",
                        "tertiary": "#1a0b00",
                        "outline": "#74777e",
                        "surface-container-low": "#edf4ff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#43474d",
                        "inverse-primary": "#b0c8eb",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#321ed2",
                        "on-secondary-container": "#fffbff",
                        "primary-container": "#0a2540",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#381d00",
                        "surface-dim": "#c9dcf2",
                        "on-primary-container": "#768dad",
                        "surface-soft": "#F6F9FC",
                        "background": "#f7f9ff",
                        "outline-variant": "#c4c6ce",
                        "tertiary-fixed": "#ffdcbe",
                        "surface-tint": "#49607e",
                        "secondary-container": "#645cff",
                        "primary-fixed": "#d2e4ff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ae835a",
                        "on-surface": "#091d2d",
                        "navy-action": "#006AFF",
                        "primary": "#000f22",
                        "on-tertiary-fixed": "#2d1600",
                        "on-background": "#091d2d",
                        "on-tertiary-fixed-variant": "#613f1c",
                        "surface-container": "#e3efff",
                        "surface-variant": "#d1e4fb",
                        "on-secondary-fixed": "#0f0069",
                        "secondary": "#4a3ee6",
                        "tertiary-fixed-dim": "#eebd90",
                        "slate-deep": "#0A2540",
                        "on-primary-fixed-variant": "#314865",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#b0c8eb",
                        "border-muted": "#E6EBF1",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f7f9ff",
                        "surface-container-highest": "#d1e4fb"
                    },
                    "fontFamily": {
                        "sans": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                },
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 2px solid theme('colors.primary'); color: theme('colors.primary'); font-weight: 600; }
        .btn-fast:active { transform: scale(0.98); transition: 0.1s; }
        .suggestion-item:hover { background-color: theme('colors.surface-container'); cursor: pointer; }
        
        /* Estilos de impresión */
        @media print {
            @page { margin: 0; size: 70mm auto; } 
            html, body { margin: 0 !important; padding: 0 !important; background: white; display: block !important; zoom: 1 !important; }
            header, nav, section, .no-print, .hidden-print { display: none !important; }
            .print-area { display: block !important; width: 68mm; position: absolute; top: 1px; left: 1px; font-family: 'JetBrains Mono', monospace; color: black; padding: 2mm; font-size: 11px; }
            body.printing-sales #ticket-print-area { display: block !important; }
            .print-logo { text-align: center; margin-bottom: 5px; }
            .print-header { text-align: center; margin-bottom: 8px; border-bottom: 1px dashed black; padding-bottom: 5px; }
            .print-info { font-size: 10px; margin-bottom: 5px; }
            .print-item { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 3px; }
            .item-name { width: 70%; }
            .print-total { font-size: 14px; font-weight: bold; text-align: right; border-top: 1px dashed black; margin-top: 8px; padding-top: 5px; }
        }
        #ticket-print-area { display: none; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-surface h-screen overflow-hidden text-on-surface" style="zoom: 0.9;">
<header class="bg-surface-container-lowest border-b border-border-muted px-6 py-4 flex justify-between items-center z-10 sticky top-0">
<div class="flex items-center gap-4">
<div class="bg-primary-container text-on-primary rounded font-medium px-2.5 py-1 text-xs">V6</div>
<div>
<h1 class="text-lg font-semibold text-primary" id="pos-main-title">Mi Negocio POS</h1>
<div class="text-xs text-on-surface-variant flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Modo Demo</div>
</div>
</div>
<div class="flex-1 max-w-2xl mx-8 relative">
<div class="relative">
<i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-outline"></i>
<input autocomplete="off" class="w-full pl-10 pr-4 py-2 border border-border-muted rounded-lg bg-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-sm" id="main-search" onkeyup="searchGlobal(event)" placeholder="Buscar productos (ESC para limpiar)" type="text"/>
</div>
<div class="absolute left-0 right-0 bg-surface-container-lowest shadow-lg rounded-b-lg border border-border-muted border-t-0 z-50 max-h-80 overflow-y-auto hidden mt-1" id="global-suggestions"></div>
</div>
<div class="flex items-center gap-4 text-sm text-on-surface-variant">
<div class="font-mono text-sm" id="clock">12:00 PM</div>
</div>
</header>
<nav class="bg-surface-container-lowest border-b border-border-muted px-6 flex items-center relative z-0">
<div class="flex gap-6">
<button class="py-3 px-1 text-sm tab-active transition-colors">Punto de Venta</button>
<button class="py-3 px-1 text-sm text-on-surface-variant hover:text-on-surface transition-colors">Catálogo</button>
<button class="py-3 px-1 text-sm text-on-surface-variant hover:text-on-surface transition-colors">Historial</button>
</div>
</nav>
<main class="flex-1 flex overflow-hidden h-[calc(100vh-121px)]">
<section class="flex-1 flex flex-col lg:flex-row" id="content-ventas">
<div class="flex-1 p-8 overflow-y-auto flex flex-col">
<h3 class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-4">Acceso Rápido</h3>
<div class="grid grid-cols-3 gap-4 mb-8">
<!-- Impresiones -->
<div class="bg-surface-container-lowest border border-border-muted rounded-xl p-4 flex flex-col gap-3 hover:shadow-sm transition-shadow">
<div class="flex items-center gap-2 text-sm font-medium text-primary">
<i class="fas fa-print"></i> Impresión
                        </div>
<div class="grid grid-cols-2 gap-2">
<button class="btn-fast py-2 px-3 rounded-lg border border-border-muted hover:bg-surface-container transition-colors flex flex-col items-start gap-1" onclick="addCart('Imp. B/N', 0.50, 1, 'IMPRESION')">
<span class="text-sm font-medium text-on-surface">Blanco y Negro</span>
<span class="text-xs font-mono text-on-surface-variant">Q0.50</span>
</button>
<button class="btn-fast py-2 px-3 rounded-lg border border-border-muted hover:bg-surface-container transition-colors flex flex-col items-start gap-1" onclick="addCart('Imp. Color', 2.00, 1, 'IMPRESION')">
<span class="text-sm font-medium text-on-surface">Color</span>
<span class="text-xs font-mono text-on-surface-variant">Q2.00</span>
</button>
</div>
</div>
<!-- Copias -->
<div class="bg-surface-container-lowest border border-border-muted rounded-xl p-4 flex flex-col gap-3 hover:shadow-sm transition-shadow">
<div class="flex items-center gap-2 text-sm font-medium text-primary">
<i class="fas fa-copy"></i> Copias
                        </div>
<div class="grid grid-cols-2 gap-2">
<button class="btn-fast py-2 px-3 rounded-lg border border-border-muted hover:bg-surface-container transition-colors flex flex-col items-start gap-1" onclick="addCart('Copia B/N', 0.25, 1, 'COPIA')">
<span class="text-sm font-medium text-on-surface">Blanco y Negro</span>
<span class="text-xs font-mono text-on-surface-variant">Q0.25</span>
</button>
<button class="btn-fast py-2 px-3 rounded-lg border border-border-muted hover:bg-surface-container transition-colors flex flex-col items-start gap-1" onclick="addCart('Copia Color', 1.50, 1, 'COPIA')">
<span class="text-sm font-medium text-on-surface">Color</span>
<span class="text-xs font-mono text-on-surface-variant">Q1.50</span>
</button>
</div>
</div>
<!-- Encuadernación -->
<div class="bg-surface-container-lowest border border-border-muted rounded-xl p-4 flex flex-col gap-3 hover:shadow-sm transition-shadow">
<div class="flex items-center gap-2 text-sm font-medium text-primary">
<i class="fas fa-book"></i> Encuadernación
                        </div>
<div class="grid grid-cols-2 gap-2">
<button class="btn-fast py-2 px-3 rounded-lg border border-border-muted hover:bg-surface-container transition-colors flex flex-col items-start gap-1" onclick="addCart('Empastado Pasta Blanda', 35.00, 1, 'EMPASTADO')">
<span class="text-sm font-medium text-on-surface">Empastado</span>
<span class="text-xs font-mono text-on-surface-variant">Q35.00</span>
</button>
<button class="btn-fast py-2 px-3 rounded-lg border border-border-muted hover:bg-surface-container transition-colors flex flex-col items-start gap-1" onclick="addCart('Encuadernado Espiral', 35.00, 1, 'ESPIRAL')">
<span class="text-sm font-medium text-on-surface">Espiral</span>
<span class="text-xs font-mono text-on-surface-variant">Q35.00</span>
</button>
</div>
</div>
</div>
<h3 class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-4">Servicios Generales</h3>
<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8">
<button class="btn-fast p-4 bg-surface-container-lowest border border-border-muted rounded-xl hover:shadow-sm hover:border-primary-fixed-dim transition-all flex flex-col items-start justify-center gap-2 text-left" onclick="addCart('Escaneo', 3.50, 1, 'ESCANEO')">
<i class="fas fa-scanner text-on-surface-variant"></i>
<div>
<div class="text-sm font-medium text-on-surface">Escaneo</div>
<div class="text-xs font-mono text-on-surface-variant">Q3.50</div>
</div>
</button>
<button class="btn-fast p-4 bg-surface-container-lowest border border-border-muted rounded-xl hover:shadow-sm hover:border-primary-fixed-dim transition-all flex flex-col items-start justify-center gap-2 text-left" onclick="addCart('Tiempo Ciber', 5.00, 1, 'CIBER')">
<i class="fas fa-desktop text-on-surface-variant"></i>
<div>
<div class="text-sm font-medium text-on-surface">Internet</div>
<div class="text-xs font-mono text-on-surface-variant">Q5.00 / hr</div>
</div>
</button>
</div>
<!-- PANEL DE TICKETS APARCADOS -->
<div class="mt-auto pt-8 border-t border-border-muted">
<div class="flex items-center gap-2 mb-4">
<i class="fas fa-pause-circle text-on-surface-variant"></i>
<h3 class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Órdenes en Espera</h3>
</div>
<div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide" id="parked-tickets-container">
<!-- Generado por JS -->
</div>
</div>
</div>
<!-- SIDEBAR DE COBRO -->
<aside class="w-96 bg-surface-container-lowest border-l border-border-muted flex flex-col z-20 shrink-0">
<div class="p-6 border-b border-border-muted flex flex-col gap-4">
<div class="flex justify-between items-center">
<h2 class="text-lg font-semibold text-primary">Orden Actual</h2>
<span class="text-xs font-medium bg-surface-container px-2.5 py-1 rounded-md text-on-surface" id="active-ticket-label">Ticket #1</span>
</div>
<div class="flex flex-col gap-3">
<label class="text-xs font-medium text-on-surface-variant">Datos del Cliente</label>
<div class="flex gap-2">
<input class="w-2/3 px-3 py-2 text-sm border border-border-muted rounded-lg bg-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" id="bill-cliente" onblur="saveClientData()" placeholder="Nombre" type="text"/>
<input class="w-1/3 px-3 py-2 text-sm border border-border-muted rounded-lg bg-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" id="bill-nit" onblur="saveClientData()" placeholder="NIT" type="text"/>
</div>
</div>
</div>
<div class="px-6 py-3 border-b border-border-muted bg-surface flex justify-between items-center text-sm">
<span class="font-medium text-on-surface-variant">Artículos</span>
<div class="flex gap-3">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1" onclick="parkCurrentTicket()"><i class="fas fa-pause text-xs"></i> Suspender</button>
<button class="text-on-surface-variant hover:text-error transition-colors" onclick="clearCart()">Vaciar</button>
</div>
</div>
<div class="flex-1 overflow-y-auto p-6 space-y-3 bg-surface" id="cart-items"></div>
<div class="p-6 border-t border-border-muted bg-surface-container-lowest flex flex-col gap-4">
<div class="flex justify-between items-baseline">
<span class="text-sm font-medium text-on-surface-variant">Total</span>
<span class="text-3xl font-bold font-mono text-primary tracking-tight" id="total-price">Q0.00</span>
</div>
<button class="w-full bg-primary hover:bg-slate-deep text-on-primary py-3.5 rounded-lg text-base font-medium shadow-sm active:scale-95 transition-all flex justify-center items-center gap-2" onclick="processVenta()">
                        Cobrar Orden
                    </button>
</div>
</aside>
</section>
</main>
<!-- ÁREA DE IMPRESIÓN -->
<div class="print-area" id="ticket-print-area">
<div class="print-logo"><h2 style="font-size:14px; margin:0; font-weight:bold;">TICKET DE VENTA</h2></div>
<div class="print-header">
<p id="print-date" style="font-size:10px; margin:4px 0;">--/--/--</p>
<div class="print-info" style="text-align:left; margin-top:5px; border-top:1px dotted black; padding-top:2px;">
<span id="print-client-name">CF</span><br/>
<span id="print-client-nit">NIT: CF</span>
</div>
</div>
<div id="print-items-container"></div>
<div class="print-total" id="print-total-display">TOTAL: Q 0.00</div>
</div>
<script>
        // SISTEMA DE TICKETS (1 Activo, Múltiples Aparcados)
        let tickets = [{ id: 1, name: 'Ticket #1', items: [], status: 'active', client: '', nit: '' }];
        let currentTicketId = 1;
        let nextTicketId = 2;

        let CATALOGO = [
            { nombre: "Cuaderno Espiral", precio: 15.00 },
            { nombre: "Lapicero BIC", precio: 2.00 },
            { nombre: "Resma Papel", precio: 45.00 }
        ];

        window.addEventListener('load', () => {
            updateTicketUI();
            renderCart();
            
            // Reloj simple
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }, 1000);
        });

        // ==========================================
        // LÓGICA DE MULTITICKETS
        // ==========================================
        
        function getCurrentTicket() {
            return tickets.find(t => t.id === currentTicketId);
        }

        function saveClientData() {
            let t = getCurrentTicket();
            if (t) {
                t.client = document.getElementById('bill-cliente').value;
                t.nit = document.getElementById('bill-nit').value;
                updateTicketUI();
            }
        }

        function createNewTicket() {
            const newId = nextTicketId++;
            tickets.push({ id: newId, name: `Ticket #${newId}`, items: [], status: 'active', client: '', nit: '' });
            currentTicketId = newId;
            
            document.getElementById('bill-cliente').value = '';
            document.getElementById('bill-nit').value = '';
            document.getElementById('active-ticket-label').innerText = `Ticket #${newId}`;
            
            updateTicketUI();
            renderCart();
        }

        function parkCurrentTicket() {
            let t = getCurrentTicket();
            if (!t) return;
            if (t.items.length === 0) {
                alert("No hay artículos en la orden para suspender.");
                return;
            }
            
            saveClientData();
            t.status = 'parked';

            createNewTicket(); 
        }

        function unparkTicket(id) {
            let current = getCurrentTicket();
            
            if (current && current.items.length > 0) {
                saveClientData();
                current.status = 'parked';
            } else if (current && current.items.length === 0) {
                tickets = tickets.filter(tk => tk.id !== current.id);
            }

            let tToUnpark = tickets.find(tk => tk.id === id);
            if (tToUnpark) {
                tToUnpark.status = 'active';
                currentTicketId = id;
                
                document.getElementById('bill-cliente').value = tToUnpark.client;
                document.getElementById('bill-nit').value = tToUnpark.nit;
                document.getElementById('active-ticket-label').innerText = tToUnpark.name;
                
                updateTicketUI();
                renderCart();
            }
        }

        // ==========================================
        // RENDERIZADO DE INTERFAZ (UI)
        // ==========================================

        function updateTicketUI() {
            const parkedContainer = document.getElementById('parked-tickets-container');
            const parkedTickets = tickets.filter(t => t.status === 'parked');
            
            if (parkedTickets.length === 0) {
                parkedContainer.innerHTML = `<p class="text-sm text-on-surface-variant py-2">No hay órdenes en espera.</p>`;
            } else {
                parkedContainer.innerHTML = parkedTickets.map(t => {
                    let total = t.items.reduce((sum, i) => sum + (i.precioUnit * i.cant), 0);
                    return `
                    <div class="min-w-[240px] bg-surface-container-lowest border border-border-muted rounded-xl p-4 flex flex-col gap-3 hover:border-primary-fixed-dim transition-colors">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="font-medium text-sm text-on-surface block">${t.name}</span>
                                <span class="text-xs text-on-surface-variant truncate w-32 block">${t.client || 'Consumidor Final'}</span>
                            </div>
                            <span class="text-xs text-on-surface-variant bg-surface px-2 py-0.5 rounded border border-border-muted">${t.items.length} items</span>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="font-mono font-medium text-base text-primary">Q${total.toFixed(2)}</span>
                            <button onclick="unparkTicket(${t.id})" class="text-sm font-medium text-primary hover:text-slate-deep transition-colors">Retomar</button>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        // ==========================================
        // LÓGICA DE CARRITO (Adaptada al ticket actual)
        // ==========================================

        function addCart(n, p, c = 1, cat, forceNew = false) {
            let t = getCurrentTicket();
            if(!t) return;
            
            let i = forceNew ? null : t.items.find(x => x.nombre === n);
            if (i) { 
                i.cant += c; 
            } else { 
                t.items.push({ nombre: n, precioUnit: p, cant: c }); 
            }
            renderCart();
            updateTicketUI();
        }

        function renderCart() {
            let t = getCurrentTicket();
            const c = document.getElementById('cart-items'); 
            c.innerHTML = ''; 
            let total = 0;
            
            if(!t || t.items.length === 0) {
                c.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-on-surface-variant space-y-3"><i class="fas fa-shopping-basket text-2xl text-border-muted"></i><p class="text-sm">Orden vacía</p></div>`;
                document.getElementById('total-price').innerText = `Q0.00`;
                return;
            }

            t.items.forEach((i, x) => {
                let subtotal = i.precioUnit * i.cant; 
                total += subtotal;
                c.innerHTML += `
                <div class="flex justify-between items-center py-2 border-b border-border-muted last:border-0">
                    <div class="flex-1">
                        <p class="font-medium text-sm text-on-surface">${i.nombre}</p>
                        <p class="text-xs text-on-surface-variant font-mono">${i.cant} x Q${i.precioUnit.toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-medium font-mono text-on-surface">Q${subtotal.toFixed(2)}</span>
                        <button onclick="removeItem(${x})" class="text-outline hover:text-error transition-colors"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('total-price').innerText = `Q${total.toFixed(2)}`;
        }

        function removeItem(index) { 
            let t = getCurrentTicket();
            if(t) { t.items.splice(index, 1); renderCart(); }
        }
        
        function clearCart() { 
            let t = getCurrentTicket();
            if(t) { t.items = []; renderCart(); }
        }

        function processVenta() {
            let t = getCurrentTicket();
            if (!t || t.items.length === 0) return;
            
            saveClientData();
            
            // Simular Impresión
            document.body.classList.add('printing-sales');
            const d = new Date();
            document.getElementById('print-date').innerText = d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
            document.getElementById('print-client-name').innerText = t.client || "CONSUMIDOR FINAL";
            document.getElementById('print-client-nit').innerText = "NIT: " + (t.nit || "CF");
            
            let totalCobrado = 0;
            const container = document.getElementById('print-items-container');
            container.innerHTML = '';
            t.items.forEach(item => {
                totalCobrado += item.precioUnit * item.cant;
                container.innerHTML += `<div class="print-item"><span class="item-name">${item.cant} ${item.nombre}</span><span class="text-right">Q${(item.precioUnit * item.cant).toFixed(2)}</span></div>`;
            });
            document.getElementById('print-total-display').innerText = `TOTAL: Q ${totalCobrado.toFixed(2)}`;
            
            window.print();
            document.body.classList.remove('printing-sales');

            // Eliminar ticket completado
            tickets = tickets.filter(tk => tk.id !== currentTicketId);
            
            // Siempre creamos uno nuevo tras cobrar
            createNewTicket();
        }
        
        // Buscador Global Básico
        function searchGlobal(e) {
            const list = document.getElementById('global-suggestions');
            const q = e.target.value.toLowerCase();
            
            if (e.key === 'Escape') {
                e.target.value = '';
                list.classList.add('hidden');
                return;
            }
            
            if (q.length < 2) { list.classList.add('hidden'); return; }
            const res = CATALOGO.filter(i => i.nombre.toLowerCase().includes(q));
            
            if (res.length > 0) {
                list.innerHTML = res.map(i => `
                    <div onclick="addCart('${i.nombre}', ${i.precio}); document.getElementById('main-search').value=''; document.getElementById('global-suggestions').classList.add('hidden');" class="suggestion-item p-3 border-b border-border-muted last:border-0 flex justify-between items-center transition-colors">
                        <span class="text-sm font-medium text-on-surface">${i.nombre}</span>
                        <span class="text-sm font-mono text-primary">Q${i.precio.toFixed(2)}</span>
                    </div>`).join('');
                list.classList.remove('hidden');
            } else { 
                list.innerHTML = `<div class="p-4 text-sm text-on-surface-variant text-center">No se encontraron productos</div>`;
                list.classList.remove('hidden'); 
            }
        }
        
        // Cerrar sugerencias al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#main-search') && !e.target.closest('#global-suggestions')) {
                document.getElementById('global-suggestions').classList.add('hidden');
            }
        });
    </script>
</body></html>
